<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixelate_Filter - 像素风图片转化器</title>
  <meta name="description" content="Pixelate_Filter 是一款轻量级纯前端像素风图片转化工具，无需登录，纯浏览器端处理，保护您的隐私。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='12' height='12' fill='%23e94560'/><rect x='18' y='2' width='12' height='12' fill='%2300b4ff'/><rect x='2' y='18' width='12' height='12' fill='%236c5ce7'/><rect x='18' y='18' width='12' height='12' fill='%23e94560'/><rect x='14' y='14' width='4' height='4' fill='%23ffffff'/></svg>" />
</head>
<body>
  <div class="app-container">

    <!-- ========== Header ========== -->
    <header class="header">
      <div class="header-logo">
        <svg class="logo-icon" width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="16" height="16" fill="#e94560" />
          <rect x="20" y="2" width="16" height="16" fill="#00b4ff" />
          <rect x="2" y="22" width="16" height="16" fill="#6c5ce7" />
          <rect x="20" y="22" width="16" height="16" fill="#e94560" />
        </svg>
        <h1>Pixelate_Filter</h1>
      </div>
      <div class="header-links">
        <button class="header-history-btn" id="historyToggleBtn" aria-label="历史记录">
          <span class="history-icon">📜</span>
          <span class="history-label">历史记录</span>
        </button>
        <a href="#" title="帮助" aria-label="帮助">❓</a>
        <a href="https://github.com" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">🐙</a>
      </div>
    </header>

    <!-- ========== 主内容区 ========== -->
    <main class="main-content">

      <!-- ===== 左侧控制面板 ===== -->
      <aside class="control-panel">

        <!-- 上传区域 -->
        <section class="panel-section">
          <div class="panel-section-title">📁 上传图片</div>
          <div class="upload-area" id="uploadArea" role="button" tabindex="0" aria-label="上传图片，点击或拖拽">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">点击或拖拽上传图片</div>
            <div class="upload-hint">支持 JPG / PNG / WebP / BMP，最大 20MB</div>
            <input type="file" id="uploadInput" class="upload-input" accept="image/jpeg,image/png,image/webp,image/bmp" />
          </div>
        </section>

        <!-- 摄像头 -->
        <section class="panel-section">
          <div class="panel-section-title">📷 摄像头拍摄</div>
          <div class="btn-group" style="margin-bottom:10px;">
            <button class="btn btn-secondary btn-sm" id="cameraToggleBtn">📷 打开摄像头</button>
          </div>
        </section>

        <!-- 像素块大小 -->
        <section class="panel-section">
          <div class="panel-section-title">🔲 像素块大小</div>
          <div class="slider-group">
            <div class="slider-label">
              <span>块大小</span>
              <span class="slider-value" id="blockSizeValue">8</span>
            </div>
            <input type="range" class="slider-track" id="blockSizeSlider" min="2" max="64" value="8" aria-label="像素块大小" />
            <div class="slider-input-group">
              <label style="font-size:13px;color:#888;font-weight:600;">精确值</label>
              <input type="number" class="slider-number-input" id="blockSizeInput" min="2" max="64" value="8" />
            </div>
          </div>
        </section>

        <!-- 色彩深度 -->
        <section class="panel-section">
          <div class="panel-section-title">🎨 色彩深度</div>
          <div class="slider-group">
            <div class="slider-label">
              <span>每通道色阶</span>
              <span class="slider-value" id="colorDepthValue">16</span>
            </div>
            <input type="range" class="slider-track" id="colorDepthSlider" min="2" max="64" value="16" aria-label="色彩深度" />
            <div class="slider-input-group">
              <label style="font-size:13px;color:#888;font-weight:600;">精确值</label>
              <input type="number" class="slider-number-input" id="colorDepthInput" min="2" max="64" value="16" />
            </div>
          </div>
        </section>

        <!-- 调色板 -->
        <section class="panel-section">
          <div class="panel-section-title">🎭 调色板风格</div>
          <div class="palette-grid" id="paletteGrid"></div>
          <div class="custom-palette-section" id="customPaletteSection">
            <div class="panel-section-title" style="margin-top:14px;">自定义颜色</div>
            <div class="custom-colors" id="customColors"></div>
            <button class="add-color-btn" id="addColorBtn" title="添加颜色">＋</button>
          </div>
        </section>

      </aside>

      <!-- ===== 右侧预览区域 ===== -->
      <section class="preview-panel">

        <div class="preview-container" id="previewContainer">

          <!-- 占位符 -->
          <div class="preview-placeholder" id="previewPlaceholder">
            <div class="preview-placeholder-icon">🖼️</div>
            <div class="preview-placeholder-text">上传图片或拍摄照片开始创作</div>
          </div>

          <!-- 上下排列：原图 + 结果 -->
          <div class="preview-stack" id="previewStack">
            <div class="preview-stack-section">
              <div class="preview-stack-label">原图</div>
              <div class="preview-stack-canvas-wrap">
                <canvas id="originalCanvas"></canvas>
              </div>
            </div>
            <div class="preview-stack-divider">
              <span>⬇ 像素化结果 ⬇</span>
            </div>
            <div class="preview-stack-section">
              <div class="preview-stack-label">结果</div>
              <div class="preview-stack-canvas-wrap">
                <canvas id="resultCanvas"></canvas>
              </div>
            </div>
          </div>

          <!-- 加载动画 -->
          <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-pixel-grid">
              <span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span>
              <span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span>
              <span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span>
              <span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span>
              <span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span>
              <span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span>
              <span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span><span class="loading-pixel"></span>
            </div>
            <div class="loading-text">PIXELATING...</div>
          </div>

        </div>

        <!-- 操作按钮（去掉了对比原图按钮） -->
        <div class="action-bar">
          <button class="btn btn-success" id="downloadBtn" disabled>💾 下载</button>
          <button class="btn btn-warning" id="resetBtn">🔄 重置</button>
        </div>

      </section>

    </main>

  </div>

  <!-- ========== 历史记录抽屉（从右侧滑出） ========== -->
  <div class="drawer-overlay" id="historyDrawerOverlay">
    <div class="drawer-panel" id="historyDrawerPanel">
      <div class="drawer-header">
        <span class="drawer-title">📜 历史记录</span>
        <button class="drawer-close-btn" id="historyDrawerCloseBtn" aria-label="关闭">✕</button>
      </div>
      <div class="drawer-body">
        <div class="history-list" id="historyList"></div>
        <div class="history-empty" id="historyEmpty" style="display:none;">暂无历史记录</div>
      </div>
      <div class="drawer-footer">
        <button class="btn btn-danger btn-sm btn-block" id="historyClearBtn">清空历史记录</button>
      </div>
    </div>
  </div>

  <!-- ========== 摄像头弹窗 ========== -->
  <div class="camera-modal-overlay" id="cameraModalOverlay">
    <div class="camera-modal">
      <div class="camera-modal-header">
        <span class="camera-modal-title">📷 摄像头拍摄</span>
        <button class="camera-modal-close" id="cameraModalCloseBtn" aria-label="关闭">✕</button>
      </div>
      <div class="camera-modal-preview">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <canvas id="cameraHiddenCanvas" class="hidden-canvas"></canvas>
      </div>
      <div class="camera-modal-controls">
        <button class="btn btn-primary btn-sm" id="cameraCaptureBtn">📸 拍摄</button>
        <button class="btn btn-secondary btn-sm" id="cameraSwitchBtn">🔄 切换镜头</button>
        <button class="btn btn-danger btn-sm" id="cameraStopBtn">⏹ 关闭</button>
      </div>
    </div>
  </div>

  <!-- ========== 下载弹窗 ========== -->
  <div class="modal-overlay" id="downloadModal">
    <div class="modal">
      <div class="modal-title">选择下载选项</div>
      <div class="modal-options">
        <div class="modal-option-group">
          <div class="modal-option-label">格式</div>
          <div class="modal-option-btns">
            <button class="modal-option-btn download-format-btn active" data-format="png">PNG（默认）</button>
            <button class="modal-option-btn download-format-btn" data-format="jpg">JPG</button>
            <button class="modal-option-btn download-format-btn" data-format="webp">WebP</button>
          </div>
        </div>
        <div class="modal-option-group">
          <div class="modal-option-label">分辨率</div>
          <div class="modal-option-btns">
            <button class="modal-option-btn download-scale-btn active" data-scale="1">原始尺寸</button>
            <button class="modal-option-btn download-scale-btn" data-scale="2">2x</button>
            <button class="modal-option-btn download-scale-btn" data-scale="4">4x</button>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-success" id="downloadConfirmBtn">确认下载</button>
        <button class="btn btn-secondary" id="downloadCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- ========== 重置确认弹窗 ========== -->
  <div class="confirm-overlay" id="confirmModal">
    <div class="confirm-modal">
      <div class="confirm-text">确定要重置所有设置和结果吗？<br/>此操作不可撤销。</div>
      <div class="confirm-actions">
        <button class="btn btn-danger" id="confirmOkBtn">确认重置</button>
        <button class="btn btn-secondary" id="confirmCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- ========== 自定义颜色选择器弹窗 ========== -->
  <div class="modal-overlay color-picker-modal" id="colorPickerModal">
    <div class="modal">
      <div class="modal-title">选择自定义颜色</div>
      <div class="modal-options">
        <input type="color" class="color-picker-input" id="colorPickerInput" value="#e94560" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-success" id="colorPickerConfirmBtn">确认添加</button>
        <button class="btn btn-secondary" id="colorPickerCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- ========== JS 脚本（按顺序加载） ========== -->
  <script src="js/utils.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/pixelate.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
